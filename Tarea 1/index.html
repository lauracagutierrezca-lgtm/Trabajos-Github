<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta animada</title>

    <style>
        body {
            background-color: #101827;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .tarjeta {
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 20px;
            background-color: #1e293b;
            color: white;
            transition: transform 0.4s;
        }

        .tarjeta:hover {
            transform: translateY(-12px) scale(1.05);
        }

        h1 {
            color: #78a6ff;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Hola profee 😄</h1>
        <p>Bienvenido a mi página web.</p>
    </div>
</body>
</html>
